<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ترست براند | خدمة العملاء والاستفسارات</title>
<link rel="icon" href="logo.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="siteHeader"></div>
<main class="container" id="main"></main>
<div id="siteFooter"></div>

<script src="imgs1.js"></script><script src="imgs2.js"></script><script src="imgs3.js"></script>
<script src="data.js"></script>
<script src="i18n.js"></script>
<script src="store.js"></script><script src="rail.js"></script>
<script>
TB.mount('');
const ar = TB.lang()==='ar';
document.getElementById('main').innerHTML = `
<div class="section-head"><h2>${ar?'خدمة العملاء والاستفسارات':'Customer service & inquiries'}</h2></div>
<div class="inq-grid">
 <div class="panel" style="padding:18px">
  <h3>${ar?'تواصل معنا':'Contact us'}</h3>
  <p>${ar?'اسأل عن منتج أو مقاس أو توصيل. اكتب لنا وسنرد عليك.':'Ask about a product, size or delivery. Write to us and we will reply.'}</p>
  <div class="cs-btns"><a class="btn btn-primary" id="csCall" href="tel:PHONE_HERE">📞 ${ar?'اتصل بنا':'Call us'}</a><a class="btn btn-secondary" id="csWa" href="https://wa.me/WHATSAPP_HERE">💬 WhatsApp</a><a class="btn btn-ghost" id="csMap" href="https://maps.google.com/?q=ADDRESS_HERE">📍 ${ar?'موقعنا':'Our location'}</a></div><p class="muted small">PHONE_HERE / WHATSAPP_HERE / ADDRESS_HERE</p>
  <h3>${ar?'أسئلة سريعة':'Quick answers'}</h3>
  <ul><li>${ar?'الدفع عند الاستلام متاح.':'Cash on delivery is available.'}</li><li>${ar?'شحن مجاني للطلبات فوق 1000 ج.م.':'Free shipping over EGP 1,000.'}</li><li>${ar?'المقاسات من S إلى XXL للملابس الطبية.':'Sizes S to XXL for scrubs and coats.'}</li></ul>
 </div>
 <div class="panel" style="padding:18px" id="inquiry">
  <h3>${ar?'أرسل استفسارك':'Send an inquiry'}</h3>
  <form class="inq-form" id="inqForm">
   <label>${ar?'الاسم':'Name'}<input name="name" required></label>
   <label>${ar?'رقم الهاتف أو البريد':'Phone or email'}<input name="contact" required></label>
   <label>${ar?'الموضوع':'Topic'}<select name="topic"><option>${ar?'منتج':'Product'}</option><option>${ar?'مقاس':'Size'}</option><option>${ar?'توصيل':'Delivery'}</option><option>${ar?'أخرى':'Other'}</option></select></label>
   <label>${ar?'رسالتك':'Message'}<textarea name="msg" rows="4" required></textarea></label>
   <button class="btn btn-primary btn-lg">${ar?'إرسال':'Send'}</button>
  </form>
  <p id="inqDone" class="stock in" hidden>${ar?'تم حفظ استفسارك. شكرا لك!':'Your inquiry was saved. Thank you!'}</p>
 </div>
</div>`;
document.getElementById('inqForm').onsubmit = async function(e){ e.preventDefault(); var f=new FormData(this), form=this;
 try { await SB.api('POST','inquiries',{name:f.get('name'),contact:f.get('contact'),topic:f.get('topic'),msg:f.get('msg')},'return=minimal'); form.reset(); document.getElementById('inqDone').hidden=false; TB.kinetic(ar?['وصلتنا','رسالتك']:['Message','received']); }
 catch(x){ alert(ar?'تعذر إرسال الرسالة. حاول مرة أخرى.':'Could not send the message. Please try again.'); } };
</script>
</body>
</html>
