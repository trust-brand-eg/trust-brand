<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ترست براند | إتمام الطلب</title>
<link rel="icon" href="logo.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="siteHeader"></div>
<main class="container" id="main"></main>
<div id="siteFooter"></div>

<script src="imgs1.js"></script><script src="imgs2.js"></script><script src="imgs3.js"></script>
<script src="data.js"></script>
<script src="i18n.js"></script>
<script src="store.js"></script><script src="rail.js"></script>
<script>
TB.mount('');
let payMethod = 'cod';
function renderCheckout() {
  const lines = TB.cartLines();
  const main = document.getElementById('main');
  if (!lines.length) {
    main.innerHTML = `<div class="panel empty-state"><div class="big">🛒</div><p class="muted">${TB.t('emptyCart')}</p><a class="btn btn-primary" href="index.html">${TB.t('continueShopping')}</a></div>`;
    return;
  }
  const lang = TB.lang();
  const subtotal = TB.cartSubtotal();
  const shipping = TB.shippingFor(subtotal);
  const acct = TB.account();
  const govs = TB.t('governates');
  main.innerHTML = `
    <h1>${TB.t('checkout')}</h1>
    <div class="checkout-layout">
      <form class="panel checkout-form" id="coForm" novalidate>
        <h3 style="margin-top:0">${TB.t('contactInfo')}</h3>
        <label>${TB.t('fullName')}</label>
        <input name="name" value="${acct ? TB.esc(acct.name) : ''}">
        <div class="field-error" data-err="name" hidden>${TB.t('required')}</div>
        <label>${TB.t('phone')}</label>
        <input name="phone" inputmode="tel" dir="ltr" value="${acct ? TB.esc(acct.phone) : ''}" placeholder="01xxxxxxxxx">
        <div class="field-error" data-err="phone" hidden>${TB.t('invalidPhone')}</div>
        <label>${TB.t('governorate')}</label>
        <select name="gov"><option value="">--</option>${govs.map(g => `<option>${TB.esc(g)}</option>`).join('')}</select>
        <div class="field-error" data-err="gov" hidden>${TB.t('required')}</div>
        <label>${TB.t('address')}</label>
        <textarea name="address" rows="2"></textarea>
        <div class="field-error" data-err="address" hidden>${TB.t('required')}</div>

        <h3 style="margin-top:26px">${TB.t('paymentMethod')}</h3>
        <label class="pay-option ${payMethod==='cod'?'selected':''}" onclick="setPay('cod')">
          <input type="radio" name="pay" ${payMethod==='cod'?'checked':''}>
          <span><span class="ph">💵 ${TB.t('payCod')}</span><br><span class="ph-hint">${TB.t('payCodHint')}</span></span>
        </label>
        <label class="pay-option ${payMethod==='card'?'selected':''}" onclick="setPay('card')">
          <input type="radio" name="pay" ${payMethod==='card'?'checked':''}>
          <span><span class="ph">💳 ${TB.t('payCard')}</span><br><span class="ph-hint">${TB.t('payCardHint')}</span></span>
        </label>
        <div class="card-fields" id="cardFields" ${payMethod==='card'?'':'hidden'}>
          <label>${TB.t('cardNumber')}</label>
          <input name="cardnum" inputmode="numeric" dir="ltr" placeholder="0000 0000 0000 0000" maxlength="19">
          <label>${TB.t('cardName')}</label>
          <input name="cardname">
          <div class="card-grid">
            <div><label>${TB.t('cardExpiry')}</label><input name="cardexp" dir="ltr" placeholder="MM/YY" maxlength="5"></div>
            <div><label>${TB.t('cardCvv')}</label><input name="cardcvv" dir="ltr" inputmode="numeric" placeholder="123" maxlength="4"></div>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top:22px">${TB.t('placeOrder')}</button>
      </form>
      <div class="panel">
        <h3 style="margin-top:0">${TB.t('orderSummary')}</h3>
        ${lines.map(l => `<div class="summary-row"><span>${l.qty} × ${TB.esc(lang==='ar'?l.product.ar:l.product.en)}</span><span>${TB.fmt(l.product.price*l.qty)}</span></div>`).join('')}
        <div class="summary-row"><span>${TB.t('shipping')}</span><strong>${shipping===0?TB.t('free'):TB.fmt(shipping)}</strong></div>
        <div class="summary-row total"><span>${TB.t('total')}</span><span>${TB.fmt(subtotal+shipping)}</span></div>
      </div>
    </div>`;
  document.getElementById('coForm').onsubmit = submitOrder;
}
function setPay(m) { payMethod = m; renderCheckout(); }
function submitOrder(e) {
  e.preventDefault();
  const f = e.target;
  let ok = true;
  f.querySelectorAll('.field-error').forEach(el => el.hidden = true);
  const showErr = k => { f.querySelector(`[data-err="${k}"]`).hidden = false; ok = false; };
  if (!f.name.value.trim()) showErr('name');
  if (!/^01[0-9]{9}$/.test(f.phone.value.trim())) showErr('phone');
  if (!f.gov.value) showErr('gov');
  if (!f.address.value.trim()) showErr('address');
  if (!ok) return;
  const order = TB.placeOrder({
    name: f.name.value.trim(), phone: f.phone.value.trim(),
    gov: f.gov.value, address: f.address.value.trim(), pay: payMethod
  });
  location.href = 'order-confirmation.html?n=' + order.number;
}
renderCheckout();
</script>
</body>
</html>
